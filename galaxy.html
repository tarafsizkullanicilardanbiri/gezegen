<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muzcuk.Systeam - Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Exo 2', sans-serif;
            overflow: hidden;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
        }

        .orbitron { font-family: 'Orbitron', sans-serif; }

        /* Glass Morphism */
        .glass {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(96, 165, 250, 0.2);
            box-shadow: 0 8px 32px 0 rgba(14, 165, 233, 0.15),
                        inset 0 0 20px 0 rgba(14, 165, 233, 0.05);
        }

        .glass-hover:hover {
            border-color: rgba(56, 189, 248, 0.5);
            box-shadow: 0 12px 40px 0 rgba(14, 165, 233, 0.25);
            transform: translateY(-2px);
        }

        /* Neon Effects */
        .neon-text {
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.8),
                         0 0 20px rgba(56, 189, 248, 0.5),
                         0 0 30px rgba(56, 189, 248, 0.3);
        }

        .neon-border {
            border: 2px solid #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5),
                        inset 0 0 15px rgba(56, 189, 248, 0.1);
        }

        /* Animations */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes rotate-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes slide-in {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .animate-pulse-glow { animation: pulse-glow 3s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-rotate { animation: rotate-slow 20s linear infinite; }

        /* Scrollbar */
        .custom-scroll::-webkit-scrollbar { width: 8px; }
        .custom-scroll::-webkit-scrollbar-track { 
            background: rgba(0,0,0,0.3); 
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, #0ea5e9, #38bdf8);
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.5);
        }

        /* Loading Screen */
        .loader {
            width: 100px;
            height: 100px;
            position: relative;
        }

        .loader::before, .loader::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            animation: pulse-ring 2s ease-out infinite;
        }

        .loader::before {
            width: 100%;
            height: 100%;
            border: 3px solid rgba(56, 189, 248, 0.5);
            animation-delay: 0s;
        }

        .loader::after {
            width: 80%;
            height: 80%;
            top: 10%;
            left: 10%;
            border: 3px solid rgba(14, 165, 233, 0.5);
            animation-delay: 0.5s;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(1.2); opacity: 0; }
        }

        .loader-core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border-radius: 50%;
            background: linear-gradient(45deg, #0ea5e9, #38bdf8);
            animation: rotate-slow 2s linear infinite;
        }

        /* Button Hover Effects */
        .btn-primary {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(56, 189, 248, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .btn-primary:hover::before {
            width: 300px;
            height: 300px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56, 189, 248, 0.4);
        }

        /* Canvas */
        #canvas-container { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 0;
        }

        /* News Card Styles */
        .news-card {
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .news-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.1), transparent);
            transition: left 0.5s;
        }

        .news-card:hover::before {
            left: 100%;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(14, 165, 233, 0.3);
        }

        /* Badge Styles */
        .badge {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.3), rgba(56, 189, 248, 0.3));
            border: 1px solid rgba(56, 189, 248, 0.5);
            backdrop-filter: blur(10px);
        }

        /* Modal Transitions */
        .modal-content {
            animation: slide-in 0.4s ease-out;
        }

        /* Planet Info Gradient */
        .planet-gradient {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(56, 189, 248, 0.1) 100%);
        }

        /* Custom Toggle Switch */
        .toggle-switch {
            width: 50px;
            height: 24px;
            background: rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            position: relative;
            cursor: pointer;
            transition: background 0.3s;
        }

        .toggle-switch.active {
            background: linear-gradient(90deg, #0ea5e9, #38bdf8);
        }

        .toggle-knob {
            width: 18px;
            height: 18px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 3px;
            transition: transform 0.3s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .toggle-switch.active .toggle-knob {
            transform: translateX(26px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .glass { padding: 1rem; }
            .news-card { flex-direction: column; }
        }
    </style>
</head>
<body>

            loaded: {},

                this.loader = new THREE.TextureLoader(manager);
            },
            
            load(url, fallbackColor) {
                if (!url) return null;
                
                try {
                    return this.loader.load(
                        url,
                        (texture) => {
                            texture.anisotropy = 16;
                            this.loaded[url] = texture;
                        },
                        undefined,
                        (error) => {                            console.warn(`Texture yüklenemedi: ${url}`, error);

                    texture: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/uranus.jpg",
                    temperature: "-195°C",
                    gravity: "8.87 m/s²",
                    description: "Yana yatmış ekseniyle diğer gezegenlerden farklıdır. Donmuş metan atmosferi mavi-yeşil renk verir.",
                    facts: [
                        "Ekseni 98 derece yana yatmış",
                        "27 bilinen uydusu var",
                        "William Herschel tarafından keşfedildi",
                        "En soğuk gezegen (-224°C rekor)"
                    ]
                },
                {
                    id: "neptune",
                    name: "NEPTÜN",
                    type: "BUZ DEVRİ",
                    radius: 15.5,
                    distance: 320,
                    rotationSpeed: 0.01,
                    orbitSpeed: 0.001,
                    color: 0x4b70dd,
                    texture: "https://cdn.jsdelivr.net/gh/mrdoob/three.js@r128/examples/textures/planets/neptune.jpg",
                    temperature: "-200°C",
                    gravity: "11.15 m/s²",
                    description: "En uzak gezegen. Süpersonik rüzgarları ve Büyük Koyu Leke fırtınasıyla bilinir.",
                    facts: [
                        "En uzak gezegen (Pluto cüce gezegen)",
                        "14 bilinen uydusu var",
                        "Süpersonik rüzgarlar (2,100 km/s)",
                        "Matematiksel tahminle keşfedildi"
                    ]
                }
            ]
        };

        // ========== THREE.JS DEĞİŞKENLERİ ==========
        let scene, camera, renderer, controls;
        let solarObjects = {};
        let timeScale = 0.5;
        let selectedObject = null;
        let loadingManager, isInitialized = false;

        // ========== YÜKLEME YÖNETİCİSİ ==========
        function initLoadingManager() {
            loadingManager = new THREE.LoadingManager();
            
            loadingManager.onStart = function(url, itemsLoaded, itemsTotal) {
                console.log(`Yükleniyor: ${url} (${itemsLoaded}/${itemsTotal})`);
            };
            
            loadingManager.onLoad = function() {
                console.log('Tüm kaynaklar yüklendi!');
                setTimeout(() => {
                    document.getElementById('loading').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('loading').style.display = 'none';
                        initThreeJS();
                    }, 1000);
                }, 500);
            };
            
            loadingManager.onProgress = function(url, itemsLoaded, itemsTotal) {
                const percent = (itemsLoaded / itemsTotal) * 100;
                document.getElementById('loading-bar').style.width = `${percent}%`;
                document.getElementById('loading-text').textContent = `Evren yükleniyor... ${Math.round(percent)}%`;
            };
            
            loadingManager.onError = function(url) {
                console.error(`Yükleme hatası: ${url}`);
            };
        }

        // ========== THREE.JS BAŞLATMA ==========
        function initThreeJS() {
            if (isInitialized) return;
            
            // Sahne
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000814, config.scene.fogDensity);
            
            // Kamera
            camera = new THREE.PerspectiveCamera(
                config.camera.fov,
                window.innerWidth / window.innerHeight,
                config.camera.near,
                config.camera.far
            );
            camera.position.set(
                config.camera.startPos.x,
                config.camera.startPos.y,
                config.camera.startPos.z
            );
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            const canvasContainer = document.getElementById('canvas-container');
            canvasContainer.appendChild(renderer.domElement);
            
            // Kontroller
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = config.controls.dampingFactor;
            controls.maxDistance = config.controls.maxDistance;
            controls.minDistance = config.controls.minDistance;
            controls.autoRotate = false;
            
            // Işıklandırma
            setupLighting();
            
            // Güneş Sistemi
            createSolarSystem();
            
            // Olay Dinleyicileri
            setupEventListeners();
            
            // Animasyon
            animate();
            
            isInitialized = true;
        }

        // ========== IŞIKLANDIRMA ==========
        function setupLighting() {
            // Ambient Light
            const ambientLight = new THREE.AmbientLight(config.scene.ambientLight, 0.4);
            scene.add(ambientLight);
            
            // Directional Light (Güneş)
            const sunLight = new THREE.DirectionalLight(0xffffff, config.scene.sunLightIntensity);
            sunLight.position.set(50, 50, 50);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 500;
            sunLight.shadow.camera.left = -100;
            sunLight.shadow.camera.right = 100;
            sunLight.shadow.camera.top = 100;
            sunLight.shadow.camera.bottom = -100;
            scene.add(sunLight);
            
            // Point Lights (Gezegen aydınlatması)
            const pointLight = new THREE.PointLight(0xffffff, 0.5, 100);
            scene.add(pointLight);
        }

        // ========== GÜNEŞ SİSTEMİ OLUŞTURMA ==========
        function createSolarSystem() {
            textureManager.init(loadingManager);
            
            // Yıldızlar
            solarSystemData.stars.forEach(starData => {
                const star = createCelestialBody(starData);
                solarObjects[starData.id] = star;
                scene.add(star);
            });
            
            // Gezegenler
            solarSystemData.planets.forEach(planetData => {
                const planet = createCelestialBody(planetData);
                solarObjects[planetData.id] = planet;
                scene.add(planet);
                
                // Uydular
                if (planetData.moons) {
                    planetData.moons.forEach(moonData => {
                        const moon = createCelestialBody(moonData);
                        planet.add(moon); // Uydu gezegene bağlı
                        solarObjects[moonData.id] = moon;
                    });
                }
            });
            
            // Yörüngeler
            createOrbits();
        }

        // ========== GÖKSEL CİSİM OLUŞTURMA ==========
        function createCelestialBody(data) {
            const geometry = new THREE.SphereGeometry(data.radius, 64, 64);
            
            let material;
            if (data.texture) {
                const texture = textureManager.load(data.texture);
                material = new THREE.MeshPhongMaterial({
                    map: texture,
                    shininess: 10,
                    specular: 0x333333
                });
            } else {
                material = new THREE.MeshPhongMaterial({
                    color: data.color,
                    shininess: 30,
                    specular: 0x222222
                });
            }
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            
            // Özellikleri sakla
            mesh.userData = {
                id: data.id,
                name: data.name,
                type: data.type,
                radius: data.radius,
                distance: data.distance,
                rotationSpeed: data.rotationSpeed || 0,
                orbitSpeed: data.orbitSpeed || 0,
                temperature: data.temperature,
                gravity: data.gravity,
                description: data.description,
                facts: data.facts || []
            };
            
            // Pozisyon
            if (data.distance) {
                mesh.position.x = data.distance;
            }
            
            return mesh;
        }

        // ========== YÖRÜNGELERİ OLUŞTURMA ==========
        function createOrbits() {
            solarSystemData.planets.forEach(planetData => {
                const orbitGeometry = new THREE.RingGeometry(
                    planetData.distance - 0.5,
                    planetData.distance + 0.5,
                    128
                );
                const orbitMaterial = new THREE.MeshBasicMaterial({
                    color: 0x1e40af,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.DoubleSide
                });
                const orbit = new THREE.Mesh(orbitGeometry, orbitMaterial);
                orbit.rotation.x = Math.PI / 2;
                scene.add(orbit);
            });
        }

        // ========== ANİMASYON DÖNGÜSÜ ==========
        function animate() {
            requestAnimationFrame(animate);
            
            // Gezegen animasyonları
            Object.values(solarObjects).forEach(obj => {
                const data = obj.userData;
                
                // Dönme
                if (data.rotationSpeed) {
                    obj.rotation.y += data.rotationSpeed * timeScale;
                }
                
                // Yörünge (sadece gezegenler için)
                if (data.orbitSpeed && data.distance) {
                    obj.position.x = Math.cos(Date.now() * 0.001 * data.orbitSpeed * timeScale) * data.distance;
                    obj.position.z = Math.sin(Date.now() * 0.001 * data.orbitSpeed * timeScale) * data.distance;
                }
            });
            
            // Kontroller güncelleme
            if (controls) controls.update();
            
            // Render
            renderer.render(scene, camera);
        }

        // ========== OLAY DİNLEYİCİLERİ ==========
        function setupEventListeners() {
            // Raycaster for object selection
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            
            function onMouseClick(event) {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
                
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(Object.values(solarObjects));
                
                if (intersects.length > 0) {
                    const object = intersects[0].object;
                    selectObject(object);
                } else {
                    closeInfo();
                }
            }
            
            // Zaman ölçeği kontrolü
            document.getElementById('time-scale').addEventListener('input', (e) => {
                timeScale = parseFloat(e.target.value);
                document.getElementById('speed-display').textContent = `${timeScale.toFixed(1)}x`;
            });
            
            // Pencere boyutu değişikliği
            window.addEventListener('resize', onWindowResize);
            
            // Tıklama olayı
            window.addEventListener('click', onMouseClick);
        }

        // ========== NESNE SEÇİMİ ==========
        function selectObject(object) {
            selectedObject = object;
            const data = object.userData;
            
            // Panel bilgilerini güncelle
            document.getElementById('object-name').textContent = data.name;
            document.getElementById('object-type').textContent = data.type;
            document.getElementById('stat-temp').textContent = data.temperature;
            document.getElementById('stat-gravity').textContent = data.gravity;
            
            // İçerik oluştur
            const content = document.getElementById('info-content');
            content.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <h3 class="text-sky-400 font-bold text-sm uppercase orbitron tracking-wider mb-2">Açıklama</h3>
                        <p class="text-gray-300 leading-relaxed">${data.description}</p>
                    </div>
                    
                    <div>
                        <h3 class="text-sky-400 font-bold text-sm uppercase orbitron tracking-wider mb-3">İlginç Gerçekler</h3>
                        <ul class="space-y-2">
                            ${data.facts.map(fact => `
                                <li class="flex items-start gap-3">
                                    <i class="fas fa-circle text-[6px] text-sky-400 mt-2 flex-shrink-0"></i>
                                    <span class="text-gray-300 text-sm">${fact}</span>
                                </li>
                            `).join('')}
                        </ul>
                    </div>
                    
                    <div class="glass p-4 rounded-xl">
                        <h3 class="text-sky-400 font-bold text-sm uppercase orbitron tracking-wider mb-3">Teknik Özellikler</h3>
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-400">Çap:</span>
                                <span class="text-sky-300 ml-2">${(data.radius * 2).toFixed(1)} birim</span>
                            </div>
                            <div>
                                <span class="text-gray-400">Uzaklık:</span>
                                <span class="text-sky-300 ml-2">${data.distance || 0} birim</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            // Panel aç
            openInfo();
            
            // Kamerayı nesneye odakla
            focusOnObject(object);
        }

        // ========== KAMERA ODAKLANMA ==========
        function focusOnObject(object) {
            const distance = object.userData.distance || 50;
            const focusDistance = Math.max(object.userData.radius * 4, 15);
            
            controls.target.copy(object.position);
            camera.position.set(
                object.position.x + focusDistance,
                object.position.y + focusDistance * 0.3,
                object.position.z + focusDistance
            );
        }

        // ========== PANEL KONTROLLERİ ==========
        function openInfo() {
            document.getElementById('info-panel').style.transform = 'translateX(0)';
        }

        function closeInfo() {
            document.getElementById('info-panel').style.transform = 'translateX(110%)';
            selectedObject = null;
            controls.target.set(0, 0, 0);
        }

        function resetCamera() {
            camera.position.set(
                config.camera.startPos.x,
                config.camera.startPos.y,
                config.camera.startPos.z
            );
            controls.target.set(0, 0, 0);
            closeInfo();
        }

        // ========== MODAL KONTROLLERİ ==========
        function openModal(type) {
            const modal = document.getElementById('modal-overlay');
            const container = document.getElementById('modal-container');
            const title = document.getElementById('modal-title');
            const body = document.getElementById('modal-body');
            
            // İçerik yükle
            switch(type) {
                case 'news':
                    title.innerHTML = '<i class="fas fa-rss"></i> UZAY HABERLERİ';
                    body.innerHTML = getNewsContent();
                    break;
                case 'gazette':
                    title.innerHTML = '<i class="fas fa-book-open"></i> UZAY ANSİKLOPEDİSİ';
                    body.innerHTML = getGazetteContent();
                    break;
                case 'about':
                    title.innerHTML = '<i class="fas fa-info-circle"></i> HAKKINDA';
                    body.innerHTML = getAboutContent();
                    break;
            }
            
            // Göster
            modal.classList.remove('hidden');
            setTimeout(() => {
                container.style.opacity = '1';
                container.style.transform = 'scale(1)';
            }, 50);
            
            // Mobil menüyü kapat
            toggleMobileMenu(false);
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            const container = document.getElementById('modal-container');
            
            container.style.opacity = '0';
            container.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // ========== MOBİL MENÜ ==========
        function toggleMobileMenu(show) {
            const menu = document.getElementById('mobile-menu');
            if (show === undefined) {
                menu.classList.toggle('hidden');
            } else {
                menu.classList.toggle('hidden', !show);
            }
        }

        // ========== MODAL İÇERİKLERİ ==========

                                    <li><i class="fas fa-sliders-h text-sky-400 mr-2"></i>Zaman Kontrolü</li>

                            </div>
                        </div>
                    </div>
                    
                    <div class="glass p-6 rounded-2xl">
                        <h3 class="text-xl font-bold text-white mb-4 orbitron">Geliştirici</h3>
                        <div class="flex items-center gap-4">
                            <div class="w-16 h-16 bg-gradient-to-br from-sky-500 to-blue-600 rounded-full flex items-center justify-center">
                                <i class="fas fa-rocket text-white text-2xl"></i>

                                <h4 class="text-lg font-bold text-white">Muzcuk.Systeam</h4>

                                    <a href="#" class="text-sky-400 hover:text-white transition-colors">
                                        <i class="fab fa-github"></i>

                                    <a href="#" class="text-sky-400 hover:text-white transition-colors">

                        </div>
                    </div>
                </div>
            `;
        }

        // ========== YARDIMCI FONKSİYONLAR ==========
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ========== UYGULAMA BAŞLATMA ==========
        document.addEventListener('DOMContentLoaded', function() {
            initLoadingManager();
            textureManager.init(loadingManager);
            
            // Yükleme simülasyonu
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 10;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                }
                document.getElementById('loading-bar').style.width = `${progress}%`;
                document.getElementById('loading-text').textContent = `Evren yükleniyor... ${Math.round(progress)}%`;
            }, 200);
        });

        // Global fonksiyonlar
        window.selectObject = selectObject;
        window.closeInfo = closeInfo;
        window.resetCamera = resetCamera;
        window.openModal = openModal;
        window.closeModal = closeModal;
        window.toggleMobileMenu = toggleMobileMenu;
    </script>
</body>
